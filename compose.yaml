services:
  postgres:
    image: postgres:17-alpine
    container_name: service-management-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: service_management
      POSTGRES_USER: service_user
      POSTGRES_PASSWORD: service_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U service_user -d service_management"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: service-management-adminer
    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: